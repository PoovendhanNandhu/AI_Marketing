[build]
  # Build command
  command = "npm run build"
  
  # Publish directory (Next.js builds to .next)
  publish = ".next"
  
  # Base directory is root (where package.json is located)
  base = "."

[build.environment]
  # Node.js version
  NODE_VERSION = "18"

# Netlify Next.js plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Standard Next.js routing (no redirects needed)

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff" 